name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/scripts/check_docs_links.py
      - .github/workflows/pages.yml

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The docs are a hand-built static site under docs/ — no generator step.
  # Check the links resolve, then publish the directory as-is.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and assets resolve
        run: python3 .github/scripts/check_docs_links.py docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
