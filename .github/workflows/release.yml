name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Run the full smoke suite before releasing
        run: |
          uv run python -m unittest discover -s tests
          cd tests/matrixlab
          make clean && make instrument
          rm -rf traces
          TRACE_ENABLE=1 TRACE_MAX=1000000 timeout 5 ./bin/matrixlab.instr || true
          uv run callscope analyze traces/ --exe bin/matrixlab.instr \
            | tee analyze.out
          grep -q "unmatched_exits=0" analyze.out

      - name: Build sdist + wheel
        run: uv build

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" dist/* \
               --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
