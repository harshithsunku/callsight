[project]
name = "callsight"
version = "0.5.0"
description = "Exact per-call timing for the C/C++ code you choose. Compile-time entry/exit tracing driven by one config file, with zero source edits — excluded code emits no hook at all."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = [
    "profiler", "profiling", "tracing", "instrumentation", "c", "cpp",
    "gcc", "flamegraph", "performance", "finstrument-functions", "embedded",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
stream = ["zstandard>=0.22"]

[project.scripts]
callsight = "callsight.cli:main"

[project.urls]
Homepage = "https://harshithsunku.github.io/callsight/"
Documentation = "https://harshithsunku.github.io/callsight/getting-started.html"
Repository = "https://github.com/harshithsunku/callsight"
Issues = "https://github.com/harshithsunku/callsight/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling ships everything under the package dir, including the non-Python
# payload (runtime C sources, Make/CMake integrations) that `callsight init`
# copies into target projects.
[tool.hatch.build.targets.wheel]
packages = ["src/callsight"]
